[theme]
# Палитра community, а не builtin. Источник правды — noctalia GUI, но на
# машине без ~/.local/state/noctalia/settings.toml этот файл и есть всё, что
# читает оболочка, поэтому он должен быть полным.
mode = "auto"
source = "community"
community_palette = "Everforest Alt"
shell_mode = "auto"

[theme.templates]
enable_builtin_templates = true
builtin_ids = [ "btop", "foot", "gtk3", "gtk4", "helix", "niri", "qt", "starship" ]

# community-шаблоны берутся из git-выкачки
# ~/.local/state/noctalia/plugins/sources/community, которую noctalia обновляет
# при старте (в журнале — plugins.git fetch origin на каждом запуске). Каталог
# не переживает откат корня, но вынесен в cache-контракт инфра, поэтому после
# первой загрузки он есть и без сети.
#
# Шаблон может не отработать по двум разным причинам, и обе видны в журнале:
#   [template_engine] skipping template … (client not installed)
#   [template_engine] failed to open template input …
# Первая — клиента нет в системе, вторая — нет выкачанного шаблона. Поэтому
# клиентов, которых нет в системе, убирать отсюда не нужно: noctalia
# пропустит их сама.
community_ids = [ "opencode", "zed", "fuzzel", "fastfetch", "zellij", "bat", "fzf", "tmux" ]

[bar.default]
# Бар — именованная подтаблица: в noctalia 5.x `[bar]` с полями не читается,
# бар остаётся дефолтным (сверху). `density` в 5.2 нет.
# position: top | bottom | left | right. right = вертикальный справа.
position = "right"
# По умолчанию margin_ends = 100 — полосы сверху и снизу. 0 = бар на всю высоту.
margin_ends = 0
# Скругления со всех сторон. concave_edge_corners по умолчанию вырезает углы
# в обратную сторону, поэтому выключен.
concave_edge_corners = false
radius_top_left = 6
radius_bottom_left = 6
radius_top_right = 6
radius_bottom_right = 6

# Состав под вертикальный бар. Из дефолта не вошли: launcher, wallpaper,
# media, clipboard, brightness. Разбираем отдельно.
start = ["control-center", "workspaces"]
center = ["clock"]
end = [
  "notifications",
  "power-profile",
  "volume",
  "network",
  "bluetooth",
  "battery",
  "privacy",
  "tray",
  "session",
]

[widget.clock]
# Горизонтальный формат — на случай переезда бара наверх; на вертикальном
# работает vertical_format.
format = "{:%H:%M}"
vertical_format = "{:%H\n%M}"

[wallpaper]
# Стабильный путь в HOME: desktop кладёт файл туда при старте. Store-путь из
# пакета не годится — исчезает при сборке мусора.
enabled = true
fill_mode = "crop"
directory = "~/.local/share/wallpapers"

[wallpaper.default]
# Стартовые обои; выбор в GUI/через IPC пишет то же в settings.toml и
# перекрывает это значение.
path = "~/.local/share/wallpapers/ef_the_cat_returns.jpg"

[lockscreen_widgets]
# enabled = false достаточно. Список widget_order и координаты cx/cy/placement_*
# не переносим: это геометрия конкретных мониторов, и в wrapps ей не место.
enabled = false
