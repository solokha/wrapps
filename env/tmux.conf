# tmux: конфиг создан wrapps, чтобы noctalia могла подключить свою тему.
#
# Шаблон tmux у noctalia ищет существующий конфиг (~/.tmux.conf,
# $XDG_CONFIG_HOME/tmux/tmux.conf или ~/.config/tmux/tmux.conf — ищет именно
# в этом порядке) и дописывает в конец одну строку source-file. Файла нет —
# apply.sh печатает «tmux config file not found», и
# ~/.config/tmux/themes/noctalia.conf не подключается.
#
# Порядок двух проверок в apply.sh: сперва наличие файла темы, потом конфига.
# Поэтому «config file not found» означает, что тема уже создана, а вот
# подключить её не к чему.
#
# Обёртки у tmux в wrapps нет сознательно (how-to-wrapps п. 4.6: конфиг
# пользовательский, как на любом сервере), но это не мешает создать файл:
# раскладка идёт по правилу «если нет», ваши правки не перезаписываются.
#
# noctalia владеет здесь ровно одной строкой — source-file её темы.
