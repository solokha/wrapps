# btop: конфиг создан wrapps, чтобы noctalia могла вписать в него тему.
#
# Шаблон btop у noctalia не создаёт файл, а правит существующий: без
# ~/.config/btop/btop.conf его apply.sh завершается с предупреждением, и
# ~/.config/btop/themes/noctalia.theme остаётся никем не прочитанным.
#
# Этот файл раскладывается по правилу «если нет»: ваши правки сюда не
# перезаписываются. noctalia владеет в нём ровно одной строкой —
# color_theme, — и дописывает её в конец.

#? Оформление: "Default" или имя файла из ~/.config/btop/themes/*.theme.
#? Тему подставляет noctalia, здесь она не задана намеренно.
