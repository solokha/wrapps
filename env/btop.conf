# btop: конфиг создан wrapps, чтобы noctalia могла вписать в него тему.
#
# Шаблон btop у noctalia не создаёт файл, а правит существующий. Без
# ~/.config/btop/btop.conf его apply.sh печатает
#   Warning: btop config file not found
# и выходит с кодом 0, ничего не создавая. Файл темы
# ~/.config/btop/themes/noctalia.theme при этом пишется, но btop без color_theme
# берёт тему "Default" (его дефолт) и этот файл не открывает.
#
# Этот файл раскладывается по правилу «если нет»: ваши правки сюда не
# перезаписываются. noctalia владеет в нём ровно одной строкой — color_theme, —
# и дописывает её в конец.

#? Оформление: "Default" или имя файла из ~/.config/btop/themes/*.theme.
#? Тему подставляет noctalia, здесь она не задана намеренно.
