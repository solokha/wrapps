# Конфиг atuin. Лежит в store и подставляется через ATUIN_CONFIG_DIR
# (env/default.nix): каталог ~/.config/atuin не в пресетах preservation и
# откатывается вместе с корнем, поэтому в home ему жить незачем — источник
# правды здесь.
#
# Данные atuin (история, ключ шифрования, meta/records, токен логина) — в
# ~/.local/share/atuin, он персистится целиком
# (infra/modules/features/preservation.nix). Потеря key делает
# синхронизированную историю нечитаемой, поэтому data-каталог — не кэш.
#
# Задан только минимум, отличающийся от встроенных дефолтов: остальное atuin
# берёт сам (эталон — `atuin default-config`).

# Проверка обновлений раз в час стучится в api.atuin.sh. Лаборатории это не
# нужно: с выключенной проверкой и без sync atuin не делает сетевых запросов
# вообще.
update_check = false

# Синхронизация — вместе с сервером на valet (services.atuin). До тех пор
# локальной базы достаточно; когда появится сервер, здесь добавятся
# auto_sync/sync_frequency/sync_address и [daemon].
auto_sync = false

[stats]
# cd и ls в статистике только шумят.
ignored_commands = ["cd", "ls"]
